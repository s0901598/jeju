<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>濟州島每日行程 原型</title>
<style>
  :root{
    --navy:#0f2f4a; --orange:#ff8a1f; --orange-d:#e8700a; --gold:#ffe28a;
    --ink:#16395a; --muted:#5b7389;
    --P:132px; /* 行程與時間軸每一格的高度,兩邊必須一樣,才能 1:1 連動 */
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#dfeaf3}
  body{font-family:"PingFang TC","Noto Sans TC",sans-serif;color:var(--ink)}
  .app{height:100dvh;max-width:430px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;position:relative;
       background:linear-gradient(180deg,#dff1ff 0%,#fff4e0 55%,#ffe9c9 100%)}
  .app::before{content:"";position:absolute;inset:0;pointer-events:none;
       background:radial-gradient(360px 240px at 100% 0%,rgba(255,138,31,.2),transparent 70%),
                  radial-gradient(360px 280px at 0% 100%,rgba(255,138,31,.16),transparent 70%)}

  /* 分頁標籤 */
  .tabs{position:relative;display:flex;gap:8px;padding:14px 16px 4px;z-index:2}
  .tab{flex:1;height:36px;border-radius:999px;border:1px solid rgba(255,138,31,.35);background:rgba(255,255,255,.7);
       font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;justify-content:center;
       cursor:pointer;transition:all .25s}
  .tab.on{background:linear-gradient(135deg,#ffa133,#ee6a0a);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(230,120,30,.35)}

  /* 左右滑動的每日頁面 */
  .pager{position:relative;flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
         scroll-behavior:smooth;overscroll-behavior-x:contain;scrollbar-width:none}
  .pager::-webkit-scrollbar{display:none}
  .day{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;min-height:0;padding-top:6px}
  .dh{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 18px 8px}
  .dh h2{font-family:"Songti TC","STSong",serif;font-weight:900;font-size:30px;letter-spacing:.08em;line-height:1}
  .dh h2 small{font-family:"PingFang TC",sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted);margin-left:8px}
  .dh .rg{display:flex;gap:6px}
  .dh .rg i{font-style:normal;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.75);
            border:1px solid rgba(255,138,31,.4);color:var(--orange-d);letter-spacing:.1em}

  /* 地圖 */
  .map{position:relative;margin:0 16px;border-radius:20px;overflow:hidden;box-shadow:0 12px 28px rgba(15,47,74,.28);flex:none}
  .map svg{display:block;width:100%;height:auto}
  .badge{position:absolute;top:10px;font-size:10px;letter-spacing:.12em;color:#ffe6c4;padding:3px 9px;border-radius:999px;
         background:rgba(8,28,45,.55);border:1px solid rgba(255,190,110,.35);backdrop-filter:blur(4px)}
  .badge.l{left:10px}.badge.r{right:10px}

  /* 霓虹路線 */
  .glow{animation:flick 3.6s infinite}
  .mid{animation:flick 3.6s infinite .05s}
  .core{animation:flick 3.6s infinite .1s}
  .flow{stroke-dasharray:3 11;animation:flow 1.1s linear infinite}
  @keyframes flick{0%,100%{opacity:1}6%{opacity:.5}8%{opacity:1}22%{opacity:.9}24%{opacity:.35}26%{opacity:1}52%{opacity:.95}54%{opacity:.5}57%{opacity:1}78%{opacity:.85}80%{opacity:1}}
  @keyframes flow{to{stroke-dashoffset:-28}}
  .ring{opacity:0;transform-box:fill-box;transform-origin:center}
  .mk.on .ring{opacity:1;animation:pulse 1.6s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.1);opacity:0}}
  .mk circle.dot{transition:all .25s}
  .mk text{pointer-events:none}
  .mk .lab{opacity:.55;transition:opacity .25s}
  .mk.on .lab{opacity:1}

  /* 時間軸 + 行程 */
  .body{flex:1;min-height:0;display:flex;margin-top:10px;position:relative}
  .tl,.cards{overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
  .tl::-webkit-scrollbar,.cards::-webkit-scrollbar{display:none}
  .end{text-align:center;padding-top:22px;font-size:12px;letter-spacing:.3em;color:#a9b8c6}
  .tl{width:78px;flex:none}
  .cards{flex:1;padding-right:16px}
  .tli{height:var(--P);position:relative;scroll-snap-align:start;cursor:pointer}
  .tli::before{content:"";position:absolute;left:67px;top:26px;bottom:-14px;width:2px;background:rgba(255,138,31,.3)}
  .tli.last::before{display:none}
  .tli .d{position:absolute;left:61px;top:14px;width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid #ffb06a;transition:all .25s;z-index:1}
  .tli .tm{position:absolute;left:0;top:12px;width:54px;text-align:right;font-size:14px;font-weight:700;color:var(--muted);transition:color .25s;font-variant-numeric:tabular-nums}
  .tli .dr{position:absolute;left:0;top:74px;width:58px;text-align:right;font-size:10px;color:#8da1b3;letter-spacing:.04em}
  .tli.on .d{background:var(--orange);border-color:#fff;box-shadow:0 0 0 3px rgba(255,138,31,.35),0 0 14px rgba(255,138,31,.9);transform:scale(1.2)}
  .tli.on .tm{color:var(--orange-d)}
  .card{height:120px;margin-bottom:12px;scroll-snap-align:start;border-radius:18px;padding:12px 14px;display:flex;gap:12px;
        background:rgba(255,255,255,.86);border:1px solid rgba(255,150,50,.28);box-shadow:0 6px 16px rgba(60,90,130,.12);
        opacity:.7;transform:scale(.975);transition:all .3s;cursor:pointer}
  .card.on{opacity:1;transform:none;border-color:rgba(255,138,31,.7);box-shadow:0 10px 24px rgba(230,120,30,.28)}
  .badge-l{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
           font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,#ffa133,#ee6a0a);box-shadow:0 4px 10px rgba(230,120,30,.35)}
  .cb{flex:1;min-width:0;display:flex;flex-direction:column}
  .r1{display:flex;align-items:center;gap:8px}
  .nm{font-family:"Songti TC",serif;font-weight:900;font-size:18px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ty{flex:none;font-size:10px;font-weight:700;color:#fff;padding:2px 8px;border-radius:999px;letter-spacing:.1em}
  .ko{font-size:12px;color:var(--muted);margin-top:2px}
  .ad{font-size:12px;color:#7a8da0;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .nt{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .go{flex:none;font-size:11px;font-weight:700;color:var(--orange-d);padding:4px 10px;border-radius:999px;border:1px solid rgba(232,112,10,.5);background:#fff}

  /* 翻頁橘子 */
  .roll{position:fixed;left:0;top:300px;width:60px;height:60px;pointer-events:none;z-index:9;opacity:0}
  .roll.go{animation:roll 1s cubic-bezier(.4,.1,.3,1)}
  .roll.go.back{animation-name:rollback}
  @keyframes rollback{0%{transform:translateX(-90px) rotate(0);opacity:0}12%{opacity:1}85%{opacity:1}100%{transform:translateX(110vw) rotate(900deg);opacity:0}}
  @keyframes roll{0%{transform:translateX(110vw) rotate(0);opacity:0}12%{opacity:1}85%{opacity:1}100%{transform:translateX(-90px) rotate(-900deg);opacity:0}}

  @media (prefers-reduced-motion:reduce){.glow,.mid,.core,.flow,.mk.on .ring{animation:none}.roll{display:none}}
</style>
</head>
<body>
<!-- 共用的 SVG 定義 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d2a42"/><stop offset="1" stop-color="#1c5273"/></linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6877"/><stop offset="1" stop-color="#3e7a6a"/></linearGradient>
    <radialGradient id="halla" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8fbf9a" stop-opacity=".75"/><stop offset="1" stop-color="#5b9a84" stop-opacity="0"/></radialGradient>
    <radialGradient id="og" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffd27a"/><stop offset=".45" stop-color="#ff8f1c"/><stop offset="1" stop-color="#cf5200"/></radialGradient>
    <filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="gl2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="coast"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
</svg>

<div class="app" id="app">
  <div class="tabs" id="tabs"></div>
  <div class="pager" id="pager"></div>
</div>

<svg class="roll" id="roll" viewBox="-30 -34 60 62"><g>
  <circle r="26" fill="url(#og)"/><ellipse cx="-9" cy="-10" rx="9" ry="5" fill="#fff" opacity=".35" transform="rotate(-30 -9 -10)"/>
  <circle cx="0" cy="-24" r="4.5" fill="#2f7a3f"/><path d="M-5,-24 L0,-30 L5,-24" stroke="#2f7a3f" stroke-width="2" fill="none"/>
</g></svg>

<script>
/* ========== 範例資料(之後換成 Alice 的正式行程) ========== */
const TYPE={airport:['機場','#2f9e6b'],spot:['景點','#1c8fb5'],food:['美食','#e5532b'],stay:['住宿','#7a6fd6']};
const DAYS=[
 {n:1,date:'02.08',wk:'一',title:'抵達濟州',rg:['北'],stops:[
  {t:'14:30',ty:'airport',name:'濟州國際機場',ko:'제주국제공항',addr:'地址待填',lon:126.493,lat:33.507,note:'抵達、領行李',lab:'l'},
  {t:'16:00',ty:'stay',name:'飯店(待填)',ko:'',addr:'地址待填',lon:126.52,lat:33.49,note:'Check-in',dr:'車程 20 分',lab:'d'},
  {t:'18:00',ty:'food',name:'東門市場',ko:'동문시장',addr:'地址待填',lon:126.5278,lat:33.5128,note:'晚餐、逛夜市',dr:'車程 10 分',lab:'r'}]},
 {n:2,date:'02.09',wk:'二',title:'東部海岸',rg:['東','南'],stops:[
  {t:'09:00',ty:'spot',name:'城山日出峰',ko:'성산일출봉',addr:'地址待填',lon:126.9425,lat:33.458,note:'登頂看海景',lab:'u'},
  {t:'11:30',ty:'spot',name:'涉地可支',ko:'섭지코지',addr:'地址待填',lon:126.9305,lat:33.4242,note:'海岸散步',dr:'車程 25 分',lab:'r'},
  {t:'12:30',ty:'food',name:'午餐(待填)',ko:'',addr:'地址待填',lon:126.8346,lat:33.3256,note:'表善一帶',dr:'車程 20 分',lab:'d'},
  {t:'15:30',ty:'food',name:'每日올레市場',ko:'매일올레시장',addr:'地址待填',lon:126.5649,lat:33.2487,note:'點心、伴手禮',dr:'車程 45 分',lab:'d'},
  {t:'18:00',ty:'stay',name:'飯店(待填)',ko:'',addr:'地址待填',lon:126.53,lat:33.255,note:'西歸浦',dr:'車程 5 分',lab:'u'}]},
 {n:3,date:'02.10',wk:'三',title:'南西海岸',rg:['南','西'],stops:[
  {t:'09:30',ty:'spot',name:'天地淵瀑布',ko:'천지연폭포',addr:'地址待填',lon:126.5545,lat:33.2468,note:'',lab:'d'},
  {t:'11:00',ty:'spot',name:'柱狀節理帶',ko:'주상절리대',addr:'地址待填',lon:126.4256,lat:33.2377,note:'中文區',dr:'車程 25 分',lab:'u'},
  {t:'14:00',ty:'spot',name:'山房山',ko:'산방산',addr:'地址待填',lon:126.314,lat:33.233,note:'',dr:'車程 20 分',lab:'d'},
  {t:'16:30',ty:'food',name:'涯月咖啡(待填)',ko:'',addr:'地址待填',lon:126.3113,lat:33.463,note:'看夕陽',dr:'車程 40 分',lab:'u'},
  {t:'19:00',ty:'stay',name:'飯店(待填)',ko:'',addr:'地址待填',lon:126.52,lat:33.49,note:'',dr:'車程 35 分',lab:'r'}]},
 {n:4,date:'02.11',wk:'四',title:'返程',rg:['北'],stops:[
  {t:'10:00',ty:'spot',name:'龍頭岩',ko:'용두암',addr:'地址待填',lon:126.5114,lat:33.516,note:'',lab:'u'},
  {t:'12:00',ty:'food',name:'午餐 / 購物(待填)',ko:'',addr:'地址待填',lon:126.49,lat:33.489,note:'',dr:'車程 10 分',lab:'d'},
  {t:'14:00',ty:'airport',name:'濟州國際機場',ko:'제주국제공항',addr:'地址待填',lon:126.493,lat:33.507,note:'辦理登機',dr:'車程 10 分',lab:'l'}]}
];

/* ========== 地圖(簡化的濟州島,經緯度投影) ========== */
const W=360,H=230;
const px=(lon,lat)=>[(lon-126.08)/0.94*W,(33.62-lat)/0.50*H];
const COAST=[[126.15,33.30],[126.17,33.35],[126.23,33.42],[126.30,33.47],[126.40,33.51],[126.50,33.52],[126.60,33.53],[126.70,33.55],[126.80,33.55],[126.88,33.52],[126.93,33.47],[126.95,33.43],[126.91,33.39],[126.85,33.33],[126.78,33.28],[126.70,33.25],[126.60,33.23],[126.50,33.23],[126.40,33.23],[126.31,33.22],[126.22,33.23],[126.16,33.26]].map(p=>px(...p));
const f=n=>n.toFixed(1);
function splineClosed(pts){const n=pts.length;let d=`M${f(pts[0][0])},${f(pts[0][1])}`;
  for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    d+=`C${f(p1[0]+(p2[0]-p0[0])/6)},${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)},${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])},${f(p2[1])}`;}
  return d+'Z';}
const ISLAND=splineClosed(COAST);
function routeD(P){let d=`M${f(P[0][0])},${f(P[0][1])}`;
  for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1;
    const s=(i%2?1:-1)*len*0.2;d+=`Q${f(mx-dy/len*s)},${f(my+dx/len*s)} ${f(b[0])},${f(b[1])}`;}
  return d;}
function arrowsSVG(P){let o='';
  for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1;
    if(len<20)continue;
    const sg=(i%2?1:-1)*len*0.2,cx=mx-dy/len*sg,cy=my+dx/len*sg;
    const x=.25*a[0]+.5*cx+.25*b[0],y=.25*a[1]+.5*cy+.25*b[1],ang=Math.atan2(dy,dx)*180/Math.PI;
    o+=`<g transform="translate(${f(x)},${f(y)}) rotate(${f(ang)}) scale(1.35)"><path d="M-4,-4.2 L4.6,0 L-4,4.2 L-2,0Z" fill="#fff6e0" stroke="#e5600a" stroke-width="1.2" stroke-linejoin="round"/></g>`;}
  return o;}
function mapSVG(day){
  const P=day.stops.map(s=>px(s.lon,s.lat));
  for(let i=1;i<P.length;i++)for(let j=0;j<i;j++){let dx=P[i][0]-P[j][0],dy=P[i][1]-P[j][1],dist=Math.hypot(dx,dy);
    if(dist<19){if(dist<.1){dx=1;dy=.3;dist=1.04}const k=19/dist;P[i]=[P[j][0]+dx*k,P[j][1]+dy*k]}}
  const d=routeD(P);
  const [hx,hy]=px(126.53,33.36);const [ux,uy]=px(126.952,33.503);
  let mk='';
  day.stops.forEach((s,i)=>{const [x,y]=P[i],L=String.fromCharCode(65+i),w=s.name.length*9.6+10;
    let lx=x,ly=y,anchor='middle',side=s.lab;
    if(side==='r'&&x+15+w>W-6)side='l'; if(side==='l'&&x-15-w<6)side='r';
    if(side==='u'){ly=y-17}else if(side==='d'){ly=y+23}else if(side==='r'){lx=x+15;ly=y+3.5;anchor='start'}else{lx=x-15;ly=y+3.5;anchor='end'}
    if(anchor==='middle')lx=Math.min(W-w/2-4,Math.max(w/2+4,lx));
    const rx=anchor==='middle'?lx-w/2:anchor==='start'?lx-4:lx-w+4;
    mk+=`<g class="mk${i===0?' on':''}" data-i="${i}">
      <circle class="ring" cx="${f(x)}" cy="${f(y)}" r="10" fill="none" stroke="#ff9a3a" stroke-width="2"/>
      <circle class="dot" cx="${f(x)}" cy="${f(y)}" r="9" fill="#0d2a42" stroke="#ffb06a" stroke-width="2"/>
      <text x="${f(x)}" y="${f(y+3.6)}" text-anchor="middle" font-size="10" font-weight="800" fill="#ffe6c4">${L}</text>
      <g class="lab"><rect x="${f(rx)}" y="${f(ly-9)}" width="${f(w)}" height="13" rx="6.5" fill="rgba(8,28,45,.72)"/>
      <text x="${f(anchor==='middle'?lx:anchor==='start'?lx+1:lx-1)}" y="${f(ly+0.8)}" text-anchor="${anchor}" font-size="9" fill="#fff">${s.name}</text></g></g>`;});
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${W}" height="${H}" fill="url(#sea)"/>
    <g stroke="#7fb4d0" stroke-width=".8" fill="none" opacity=".16"><path d="M0,30 Q45,24 90,30 T180,30 T270,30 T360,30"/><path d="M0,200 Q60,193 120,200 T240,200 T360,200"/><path d="M0,226 Q50,220 100,226 T200,226 T300,226"/></g>
    <path d="${ISLAND}" fill="#6fd0e8" opacity=".35" filter="url(#coast)"/>
    <path d="${ISLAND}" fill="url(#land)" stroke="rgba(255,255,255,.35)" stroke-width="1"/>
    <circle cx="${f(ux)}" cy="${f(uy)}" r="5" fill="url(#land)" stroke="rgba(255,255,255,.3)"/>
    <ellipse cx="${f(hx)}" cy="${f(hy)}" rx="64" ry="34" fill="url(#halla)"/>
    <g fill="none" stroke="#cfeedd" opacity=".18"><ellipse cx="${f(hx)}" cy="${f(hy)}" rx="52" ry="26"/><ellipse cx="${f(hx)}" cy="${f(hy)}" rx="36" ry="17"/><ellipse cx="${f(hx)}" cy="${f(hy)}" rx="19" ry="8"/></g>
    <text x="${f(hx)}" y="${f(hy+3)}" text-anchor="middle" font-size="8" fill="#e6f6ec" opacity=".7" letter-spacing="1">▲ 漢拿山</text>
    <path class="glow" d="${d}" fill="none" stroke="#ff6a00" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".6" filter="url(#gl)"/>
    <path class="mid" d="${d}" fill="none" stroke="#ff8a1f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".95" filter="url(#gl2)"/>
    <path class="core" d="${d}" fill="none" stroke="#fff1d0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="flow" d="${d}" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    ${arrowsSVG(P)}
    ${mk}</svg>`;}

/* ========== 組頁面 ========== */
const P=132;
const tabsEl=document.getElementById('tabs'),pager=document.getElementById('pager');
DAYS.forEach((d,di)=>{
  const t=document.createElement('div');t.className='tab'+(di===0?' on':'');t.textContent='Day '+d.n;
  t.onclick=()=>pager.scrollTo({left:di*pager.clientWidth});tabsEl.appendChild(t);
  const letters=d.stops.map((_,i)=>String.fromCharCode(65+i)).join(' → ');
  const pg=document.createElement('section');pg.className='day';pg.dataset.d=di;
  pg.innerHTML=`
   <div class="dh"><h2>Day ${d.n}<small>${d.date} 週${d.wk} · ${d.title}</small></h2><div class="rg">${d.rg.map(r=>`<i>${r}</i>`).join('')}</div></div>
   <div class="map">${mapSVG(d)}<span class="badge l">${letters}</span><span class="badge r">範例</span></div>
   <div class="body">
     <div class="tl">${d.stops.map((s,i)=>`<div class="tli${i===0?' on':''}${i===d.stops.length-1?' last':''}" data-i="${i}"><span class="tm">${s.t}</span><span class="d"></span>${s.dr?`<span class="dr">${s.dr}</span>`:''}</div>`).join('')}<div class="sp"></div></div>
     <div class="cards">${d.stops.map((s,i)=>{const [tn,tc]=TYPE[s.ty];return `<div class="card${i===0?' on':''}" data-i="${i}">
        <div class="badge-l">${String.fromCharCode(65+i)}</div>
        <div class="cb"><div class="r1"><span class="nm">${s.name}</span><span class="ty" style="background:${tc}">${tn}</span></div>
        <div class="ko">${s.ko||'&nbsp;'}</div><div class="ad">📍 ${s.addr}</div>
        <div class="ft"><span class="nt">${s.note||''}</span><span class="go">導航 ›</span></div></div></div>`}).join('')}<div class="sp"><div class="end">Day ${d.n} · 完</div></div></div>
   </div>`;
  pager.appendChild(pg);

  /* 時間軸 <-> 行程 雙向連動 */
  const tl=pg.querySelector('.tl'),cards=pg.querySelector('.cards');
  let src=null,ts=0;
  const setActive=i=>{
    pg.querySelectorAll('.tli').forEach((e,k)=>e.classList.toggle('on',k===i));
    pg.querySelectorAll('.card').forEach((e,k)=>e.classList.toggle('on',k===i));
    pg.querySelectorAll('.mk').forEach((e,k)=>e.classList.toggle('on',k===i));};
  const link=(a,b)=>a.addEventListener('scroll',()=>{
    if(src&&src!==a&&performance.now()-ts<150)return;
    src=a;ts=performance.now();b.scrollTop=a.scrollTop;
    setActive(Math.max(0,Math.min(d.stops.length-1,Math.round(a.scrollTop/P))));},{passive:true});
  link(tl,cards);link(cards,tl);
  pg.querySelectorAll('.tli').forEach(e=>e.onclick=()=>tl.scrollTo({top:e.dataset.i*P,behavior:'smooth'}));
  pg.querySelectorAll('.card').forEach(e=>e.onclick=()=>cards.scrollTo({top:e.dataset.i*P,behavior:'smooth'}));
});
function fitSpacers(){document.querySelectorAll('.tl,.cards').forEach(l=>{l.querySelector('.sp').style.height=Math.max(0,l.clientHeight-P)+'px'})}
fitSpacers();addEventListener('resize',fitSpacers);

/* 換日:標籤同步 + 橘子滾過 */
let cur=0,quiet=true;
pager.addEventListener('scroll',()=>{
  const i=Math.round(pager.scrollLeft/pager.clientWidth);if(i===cur)return;const back=i<cur;cur=i;
  [...tabsEl.children].forEach((t,k)=>t.classList.toggle('on',k===i));
  if(!quiet){const r=document.getElementById('roll');r.classList.remove('go','back');void r.getBoundingClientRect();if(back)r.classList.add('back');r.classList.add('go');}
},{passive:true});

/* 測試用:?day=2&i=2&drive=cards|timeline */
const q=new URLSearchParams(location.search);
if(q.get('day')){const st=document.createElement('style');st.textContent='*{transition:none!important}';document.head.appendChild(st);setTimeout(()=>{
  pager.style.scrollBehavior='auto';pager.scrollLeft=(q.get('day')-1)*pager.clientWidth;
  const pg=pager.children[q.get('day')-1],i=+q.get('i')||0;
  const tgt=pg.querySelector(q.get('drive')==='timeline'?'.tl':'.cards');
  tgt.style.scrollBehavior='auto';tgt.scrollTop=i*P;
  setTimeout(()=>{pager.style.scrollBehavior='';quiet=false},400);
},60)}else{setTimeout(()=>quiet=false,400)}
</script>
</body>
</html>
